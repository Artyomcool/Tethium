<body>
<main class="study">
  <header class="study-head"><div class="study-title"><span class="eyebrow">TETHIUM / 02</span><h1>Проекты и сессии</h1></div><div class="study-controls"><button class="demo-button" data-action="finish-demo">✓ Завершить ответ · демо</button><div class="devices" aria-label="Устройство"><button data-device="desktop" aria-pressed="true">Ноутбук</button><button data-device="android" aria-pressed="false">Android</button></div></div></header>
  <div id="preview"></div>
  <footer class="study-foot"><div><b>Активна до явной деактивации.</b></div><div class="demo-label">Макет · демоданные · без реального выполнения</div></footer>
</main>
<div class="toast" role="status" aria-live="polite" hidden></div>
<div class="modal-backdrop" id="modal" hidden></div>
<script>
(() => {
  'use strict';
  const root = document.querySelector('.study');
  const projects = [
    {id:'tethium',name:'Tethium',letter:'T',tone:'',branch:'main'},
    {id:'atlas',name:'Atlas API',letter:'A',tone:'atlas',branch:'feat/auth'},
    {id:'notes',name:'Fieldnotes',letter:'F',tone:'notes',branch:'main'}
  ];
  const sessions = [
    {id:'s04',project:'tethium',title:'Переподключение Android',active:true,run:'running',time:'сейчас',messages:[]},
    {id:'s03',project:'tethium',title:'Панель проектов и сессий',active:true,run:'waiting',time:'8 мин',messages:[]},
    {id:'s02',project:'tethium',title:'Структура хранилища',active:true,run:'idle',time:'вчера',messages:[]},
    {id:'s09',project:'atlas',title:'Обновление токенов',active:true,run:'running',time:'сейчас',messages:[]},
    {id:'s08',project:'atlas',title:'Контракт событий API',active:true,run:'idle',time:'25 мин',messages:[]},
    {id:'s12',project:'notes',title:'Импорт заметок',active:true,run:'idle',time:'вчера',messages:[]},
    {id:'s11',project:'notes',title:'Поиск по тексту',active:true,run:'idle',time:'вчера',messages:[]},
    {id:'s01',project:'tethium',title:'Первый запуск приложения',active:false,run:'idle',time:'28 окт',messages:[]},
    {id:'s00',project:'tethium',title:'Настройка окружения',active:false,run:'idle',time:'27 окт',messages:[]},
    {id:'s07',project:'atlas',title:'Health endpoint',active:false,run:'idle',time:'29 окт',messages:[]},
    {id:'s06',project:'atlas',title:'Схема авторизации',active:false,run:'idle',time:'26 окт',messages:[]},
    {id:'s10',project:'notes',title:'Каркас редактора',active:false,run:'idle',time:'25 окт',messages:[]}
  ];
  const state={device:'desktop',selected:'s04',mobileSession:false,openProjects:new Set(['tethium','atlas']),inactiveOpen:false,openInactive:new Set(['tethium']),drafts:{},nextId:20,undo:null};
  const runLabels={running:'Работает',waiting:'Ждёт ответа',idle:'Готова к продолжению'};
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paths={chevron:'<path d="m9 5 7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',laptop:'<rect x="4" y="3" width="16" height="13" rx="2"/><path d="m4 16-2 4h20l-2-4M9 20h6"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M9 12h6"/>',send:'<path d="m5 12 7-7 7 7M12 5v15"/>',back:'<path d="m14 5-7 7 7 7"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10M18 8c0 5-12 3-12 8"/>',restore:'<path d="M3 5v6h6M3.5 10A9 9 0 1 1 4 17"/>',file:'<path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 13h8M8 17h6"/>'};
  const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`;
  const projectIcon=p=>`<span class="project-icon ${p.tone}">${esc(p.letter)}</span>`;
  const current=()=>sessions.find(s=>s.id===state.selected);
  const projectOf=s=>projects.find(p=>p.id===s.project);
  const byProject=(p,active)=>sessions.filter(s=>s.project===p.id&&s.active===active);
  const sessionRow=s=>{const label=`${s.title} · ${s.active||s.run==='running'?runLabels[s.run]:'Деактивирована'} · ${s.time}`;return `<button class="session-button ${state.selected===s.id?'selected':''}" data-session="${s.id}" title="${esc(label)}" aria-label="${esc(label)}" ${state.selected===s.id?'aria-current="true"':''}><span class="dot ${s.run}" aria-hidden="true"></span><span class="session-text"><span class="session-name">${esc(s.title)}</span></span></button>`;};
  function projectGroup(p,active){
    const list=byProject(p,active),expanded=(active?state.openProjects:state.openInactive).has(p.id),prefix=active?'active':'inactive';
    return `<section class="project" data-project-group="${p.id}" data-group-type="${prefix}"><div class="project-row"><button class="project-toggle" data-project="${p.id}" data-section="${prefix}" aria-expanded="${expanded}" aria-controls="${prefix}-${p.id}">${icon('chevron','chevron')}${projectIcon(p)}<span class="project-name">${esc(p.name)}</span><span class="project-count">${list.length}</span></button>${active?`<button class="icon-button" data-action="new-session" data-project-id="${p.id}" aria-label="Новая сессия в ${esc(p.name)}" title="Новая сессия">${icon('plus')}</button>`:''}</div><div class="session-list" id="${prefix}-${p.id}" ${expanded?'':'hidden'}>${list.length?list.map(sessionRow).join(''):`<div class="session-empty">Активных сессий пока нет.<button class="empty-action" data-action="new-session" data-project-id="${p.id}">Создать сессию</button></div>`}</div></section>`;
  }
  function sidebar(){
    const active=sessions.filter(s=>s.active).length,inactive=sessions.length-active;
    return `<aside class="sidebar" aria-label="Проекты и сессии"><div class="sidebar-head"><div class="sidebar-title"><h2>Проекты</h2><button class="icon-button" data-action="new-project" aria-label="Добавить проект" title="Добавить проект">${icon('plus')}</button></div><div class="host"><span class="dot running"></span><span class="host-name">Raider-Laptop</span><span>· ${state.device==='android'?'подключён':'на этом устройстве'}</span></div></div><div class="section-label"><span>Активные сессии</span><span class="label-count">${active}</span></div><div class="project-list">${projects.map(p=>projectGroup(p,true)).join('')}</div><section class="inactive"><button class="inactive-toggle" data-action="toggle-inactive" aria-expanded="${state.inactiveOpen}" aria-controls="inactive-projects">${icon('archive')}<span>Деактивированные</span><span class="inactive-count">${inactive}</span>${icon('chevron','chevron')}</button><div class="inactive-projects" id="inactive-projects" ${state.inactiveOpen?'':'hidden'}>${projects.filter(p=>byProject(p,false).length).map(p=>projectGroup(p,false)).join('')||'<div class="session-empty">Деактивированных сессий нет.</div>'}</div></section></aside>`;
  }
  function message(author,content,time='09:41'){
    return `<article class="message ${author}"><div class="message-author"><span class="avatar ${author==='assistant'?'agent':''}">${author==='assistant'?'✳':'R'}</span><span>${author==='assistant'?'Ассистент':'Вы'}</span><span class="message-time">${time}</span></div><div class="message-content">${content}</div></article>`;
  }
  function seedMessages(s){
    if(s.created)return '';
    if(s.id==='s04')return message('user','<p>Сделай так, чтобы после потери связи на Android можно было вернуться в эту же сессию. История и введённое сообщение должны сохраняться.</p>','09:38')+message('assistant','<p>Проверю восстановление соединения и сохранение контекста. Выполнение остаётся на ноутбуке; телефон получает состояние той же сессии.</p><div class="work-log"><div class="work-log-head">'+icon('file')+' Работа с соединением</div><div class="work-log-line"><span class="check">✓</span> Сохранение истории сессии<span class="path">SessionStore.java</span></div><div class="work-log-line"><span class="check">✓</span> Повторное подключение<span class="path">Connection.java</span></div><div class="work-log-line"><span class="dot '+(s.run==='running'?'running':'idle')+'"></span> Проверка восстановления событий</div></div>','09:40');
    if(s.id==='s03')return message('user','<p>Проекты должны раскрываться независимо. Деактивированные сессии убери в отдельный блок внизу.</p>','09:27')+message('assistant','<p>Подготовил вертикальный список проектов. В каждом остаются активные сессии, даже если ассистент уже закончил ответ.</p><div class="run-note waiting-note"><strong>Нужно уточнение</strong>Сохранять раскрытые проекты при следующем запуске?</div>'+(s.answered?'':'<button class="quiet-button reply-choice" data-action="answer-waiting">Да, сохранять раскрытые проекты</button>'),'09:33');
    if(s.id==='s02')return message('user','<p>Продумай хранение проектов, сессий и истории сообщений на ноутбуке.</p>','Вчера')+message('assistant','<p>У проекта есть список сессий. У каждой сессии отдельно хранятся история, активность и состояние выполнения.</p><p>Завершение ответа меняет только состояние выполнения. В список деактивированных сессия переходит по явному действию пользователя.</p><div class="run-note"><strong>Ответ завершён</strong>Эта сессия остаётся активной. Можно продолжить с того же места.</div>','Вчера');
    if(s.id==='s09')return message('user','<p>Проверь обновление токена во время подписки на события API.</p>','09:36')+message('assistant','<p>Проверяю сценарии истечения токена и повторной авторизации. Затем проверю продолжение подписки с последнего события.</p>','09:39');
    return message('user',`<p>${esc(s.title)}. Подготовь основу и проверь основной сценарий.</p>`,s.time)+message('assistant',`<p>Основа подготовлена, основной сценарий проверен. История и контекст сохранены для дальнейшей работы.</p>${s.active?'<div class="run-note"><strong>Ответ завершён</strong>Сессия остаётся в активных.</div>':''}`,s.time);
  }
  function composer(s){
    if(!s.active)return `<div class="composer-area"><div class="deactivated-banner"><p><b>Сессия деактивирована</b>История сохранена. Активируйте сессию, чтобы продолжить.</p><button class="primary" data-action="activate">${icon('restore')}Активировать</button></div></div>`;
    return `<div class="composer-area"><form class="composer" data-compose><textarea aria-label="Сообщение в сессию" placeholder="Продолжить сессию…" rows="2">${esc(state.drafts[s.id]||'')}</textarea><div class="compose-tools"><span class="compose-meta">${icon('laptop')}Raider-Laptop<span>·</span>Локально</span><div class="compose-actions">${s.run==='running'?`<button type="button" class="stop" data-action="stop" title="Остановить ответ, сохранив сессию активной">${icon('stop')}<span>Остановить</span></button>`:''}<button class="send" type="submit" aria-label="Отправить сообщение">${icon('send')}<span>Отправить</span></button></div></div></form><div class="composer-caption"><span>Выполнение на ноутбуке · доступно с Android</span><span><b>Активна</b>, пока вы не деактивируете</span></div></div>`;
  }
  function sessionPane(){
    const s=current();if(!s)return '<section class="session-pane"><div class="empty-pane"><span class="logo">t</span><h2>Выберите сессию</h2><p>Откройте проект слева и продолжите работу или создайте новую сессию.</p></div></section>';
    const p=projectOf(s),stripText=s.run==='running'?'Ассистент работает на ноутбуке':s.run==='waiting'?'Ассистент ждёт вашего ответа':'Ассистент закончил ответ';
    return `<section class="session-pane" aria-label="Выбранная сессия"><header class="session-head"><div class="session-heading"><button class="mobile-back" data-action="show-projects">${icon('back')}Проекты и сессии</button><div class="session-breadcrumb">${projectIcon(p)}<span>${esc(p.name)}</span><span class="slash">/</span><span>Сессия</span></div><h2>${esc(s.title)}</h2></div><div class="session-actions"><span class="activity-state ${s.active?'':'off'}">${s.active?'Активна':'Деактивирована'}</span><button class="quiet-button" data-action="${s.active?'deactivate':'activate'}">${icon(s.active?'archive':'restore')}${s.active?'Деактивировать':'Активировать'}</button></div></header><div class="session-strip"><span class="strip-state ${s.run}"><span class="dot ${s.run}"></span>${s.created&&!s.messages.length?'Готова к первому сообщению':stripText}</span><div class="strip-meta"><span class="branch">${icon('branch')}${p.branch}</span><span>${icon('laptop')}Raider-Laptop</span></div></div><div class="conversation"><div class="conversation-inner"><div class="date-separator">${s.time==='вчера'||!s.active?'История сессии':'Сегодня'}</div>${s.created&&!s.messages.length?'<div class="empty-pane"><span class="avatar agent">✳</span><h2>С чего начнём?</h2><p>Сообщение начнёт работу в проекте '+esc(p.name)+'. Эта сессия останется активной до деактивации.</p></div>':seedMessages(s)}${s.messages.map(m=>message(m.author,`<p>${esc(m.text).replace(/\n/g,'<br>')}</p>`,'сейчас')).join('')}</div></div>${composer(s)}</section>`;
  }
  function render(){
    const scrolls={projects:root.querySelector('.project-list')?.scrollTop||0,inactive:root.querySelector('.inactive-projects')?.scrollTop||0,conversation:root.querySelector('.conversation')?.scrollTop||0};
    root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(state.device===b.dataset.device)));
    document.querySelector('#preview').innerHTML=`<section class="app compact ${state.device==='android'?'android':''} ${state.mobileSession?'mobile-session':''}" aria-label="Макет Tethium"><div class="titlebar"><div class="brand"><span class="logo">t</span>Tethium</div><span class="phone-time">09:41</span><div class="title-center">Личное пространство</div><div class="window-controls" aria-hidden="true">${state.device==='android'?'<span>▴</span><span>87%</span>':'<span>−</span><span>□</span><span>×</span>'}</div></div><div class="layout">${sidebar()}${sessionPane()}</div><div class="statusbar"><span>${icon('laptop')}Raider-Laptop · ${state.device==='android'?'подключён':'исполнение здесь'}</span><span class="statusbar-right">Проектов: ${projects.length} · активных сессий: ${sessions.filter(s=>s.active).length}</span></div></section>`;
    root.querySelector('.project-list').scrollTop=scrolls.projects;
    const inactive=root.querySelector('.inactive-projects');if(inactive)inactive.scrollTop=scrolls.inactive;
    const conversation=root.querySelector('.conversation');if(conversation)conversation.scrollTop=scrolls.conversation;
    root.querySelector('[data-action="finish-demo"]').disabled=!current()||current().run!=='running';
  }
  let toastTimer;
  function toast(text,undoId=null){state.undo=undoId;const box=document.querySelector('.toast');box.innerHTML=`<span>${esc(text)}</span>${undoId?'<button data-undo>Вернуть</button>':''}`;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{box.hidden=true;state.undo=null;},5500);}
  function focus(selector){root.querySelector(selector)?.focus({preventScroll:true});}
  function scrollConversation(){const box=root.querySelector('.conversation');if(box)box.scrollTop=box.scrollHeight;}
  function deactivate(s){s.active=false;render();toast('Сессия перемещена в деактивированные',s.id);focus('.session-actions [data-action="activate"]');}
  function activate(s){s.active=true;state.openProjects.add(s.project);render();toast('Сессия снова в активных');focus('.session-actions [data-action="deactivate"]');}
  let modalTrigger=null;
  function openModal(type,projectId){
    modalTrigger=document.activeElement;const modal=document.querySelector('#modal'),isProject=type==='project',p=projects.find(p=>p.id===projectId);
    modal.innerHTML=`<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" data-create="${type}" data-project-id="${projectId||''}"><h2 id="dialog-title">${isProject?'Добавить проект':'Новая сессия'}</h2><p>${isProject?'Добавление демонстрационного проекта в макет.':esc(p.name)+' · сессия появится в активных'}</p><label for="item-name">${isProject?'Название проекта':'Название сессии'}</label><input id="item-name" name="name" required maxlength="80" autocomplete="off" placeholder="${isProject?'Например, личный сайт':'О чём эта сессия'}"><div class="dialog-error" role="alert" hidden></div><div class="dialog-actions"><button type="button" class="quiet-button" data-close-modal>Отмена</button><button type="submit" class="primary">${isProject?'Добавить':'Создать сессию'}</button></div></form>`;
    modal.hidden=false;modal.querySelector('input').focus();
  }
  function closeModal(){const modal=document.querySelector('#modal');modal.hidden=true;modal.innerHTML='';modalTrigger?.focus({preventScroll:true});}
  root.addEventListener('input',e=>{if(e.target.matches('[data-compose] textarea')&&current())state.drafts[current().id]=e.target.value;});
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.device){state.device=b.dataset.device;state.mobileSession=false;render();return;}
    if(b.dataset.project){const set=b.dataset.section==='active'?state.openProjects:state.openInactive;set.has(b.dataset.project)?set.delete(b.dataset.project):set.add(b.dataset.project);render();focus(`[data-project="${b.dataset.project}"][data-section="${b.dataset.section}"]`);return;}
    if(b.dataset.session){state.selected=b.dataset.session;state.mobileSession=true;render();scrollConversation();focus(state.device==='android'||window.innerWidth<=540?'.mobile-back':`[data-session="${state.selected}"]`);return;}
    const s=current();
    switch(b.dataset.action){
      case 'toggle-inactive':state.inactiveOpen=!state.inactiveOpen;render();focus('[data-action="toggle-inactive"]');break;
      case 'new-session':openModal('session',b.dataset.projectId);break;
      case 'new-project':openModal('project');break;
      case 'show-projects':state.mobileSession=false;render();focus(`[data-session="${state.selected}"]`);break;
      case 'deactivate':if(s)deactivate(s);break;
      case 'activate':if(s)activate(s);break;
      case 'finish-demo':if(s&&s.run==='running'){s.run='idle';s.time='сейчас';s.messages.push({author:'assistant',text:'Готово. Ответ завершён, контекст сохранён. Можно продолжить работу в этой же сессии.'});render();scrollConversation();toast(s.active?'Ответ завершён. Сессия осталась активной.':'Ответ завершён. Сессия остаётся деактивированной.');}break;
      case 'stop':if(s){s.run='idle';s.messages.push({author:'assistant',text:'Ответ остановлен. Сессия и её контекст сохранены.'});render();scrollConversation();toast('Ответ остановлен. Сессия остаётся активной.');}break;
      case 'answer-waiting':if(s){s.answered=true;s.run='running';s.messages.push({author:'user',text:'Да, сохранять раскрытые проекты.'});render();scrollConversation();toast('Ответ добавлен в демосессию');}break;
    }
  });
  root.addEventListener('submit',e=>{
    if(!e.target.matches('[data-compose]'))return;e.preventDefault();const s=current();if(!s?.active)return;
    const field=e.target.querySelector('textarea'),text=field.value.trim();if(!text){field.focus();return;}
    s.messages.push({author:'user',text});s.run='running';s.time='сейчас';state.drafts[s.id]='';render();scrollConversation();focus('[data-compose] textarea');toast('Сообщение добавлено в демосессию');
  });
  document.querySelector('.toast').addEventListener('click',e=>{if(e.target.closest('[data-undo]')&&state.undo){const s=sessions.find(s=>s.id===state.undo);if(s)activate(s);}});
  const modal=document.querySelector('#modal');
  modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close-modal]'))closeModal();});
  modal.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();closeModal();}
    if(e.key==='Tab'){const items=[...modal.querySelectorAll('input,button')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  modal.addEventListener('submit',e=>{
    e.preventDefault();const form=e.target,name=form.querySelector('input').value.trim();
    if(!name){const error=form.querySelector('.dialog-error');error.textContent='Введите название.';error.hidden=false;return;}
    if(form.dataset.create==='project'){
      const p={id:'project'+state.nextId++,name,letter:name[0].toUpperCase(),tone:'custom',branch:'main'};projects.push(p);state.openProjects.add(p.id);closeModal();render();root.querySelector(`[data-project="${p.id}"]`).scrollIntoView({block:'nearest'});focus(`[data-project="${p.id}"]`);toast('Демонстрационный проект добавлен');
    }else{
      const s={id:'session'+state.nextId++,project:form.dataset.projectId,title:name,active:true,run:'idle',time:'сейчас',messages:[],created:true};sessions.push(s);state.selected=s.id;state.openProjects.add(s.project);state.mobileSession=true;closeModal();render();focus('[data-compose] textarea');toast('Новая сессия добавлена в активные');
    }
  });
  render();
})();
</script>
</body>
</html>
