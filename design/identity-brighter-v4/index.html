<!doctype html><html lang="ru"><meta charset="utf-8"><title>8 вариантов яркости и контраста</title><style>body{background:#25272b;color:#ddd;font:15px system-ui;margin:24px}h1{font-size:23px}button{padding:8px 12px;margin:0 8px 12px 0;cursor:pointer}.board{display:grid;grid-template-columns:175px 1040px;width:max-content}.cols{display:grid;grid-template-columns:repeat(8,1fr);height:36px;text-align:center;font-size:12px}.rows{display:grid;grid-template-rows:repeat(8,1fr)}.rows button{background:transparent;border:0;color:inherit;text-align:left;margin:0}.rows button:hover{background:#ffffff12}.sheet{position:relative;width:1040px;height:1040px;background:#25272b}.sheet img{width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;grid-template-rows:repeat(8,1fr)}.overlay div{cursor:pointer}.overlay div:hover{outline:1px solid #aaa;background:#ffffff05}#choice{height:24px}</style><h1>Выбранные иконки — 8 вариантов обработки</h1><p>Каждая строка — полный набор. Отличаются яркость, насыщенность, температура света и контраст граней.</p><button onclick="document.querySelector('.sheet').style.background='#25272b'">Тёмный фон</button><button onclick="document.querySelector('.sheet').style.background='#eeece8'">Светлый фон</button><p id="choice">Выбор: —</p><div class="board"><div></div><div class="cols"><span>Логика</span><span>Верификация</span><span>Графика</span><span>Мелкие задачи</span><span>Прогресс</span><span>H3Phoenix2</span><span>US</span><span>SBG</span></div><div class="rows"><button onclick="choose(1)">1. Лёгкое усиление</button><button onclick="choose(2)">2. Чёткий нейтральный</button><button onclick="choose(3)">3. Чуть насыщеннее</button><button onclick="choose(4)">4. Тёплый свет</button><button onclick="choose(5)">5. Холодный свет</button><button onclick="choose(6)">6. Светлый матовый</button><button onclick="choose(7)">7. Контраст граней</button><button onclick="choose(8)">8. Сбалансированный</button></div><div class="sheet"><img src="atlas.png"><div class="overlay"><div onclick="choose(1)" title="1. Лёгкое усиление"></div><div onclick="choose(2)" title="2. Чёткий нейтральный"></div><div onclick="choose(3)" title="3. Чуть насыщеннее"></div><div onclick="choose(4)" title="4. Тёплый свет"></div><div onclick="choose(5)" title="5. Холодный свет"></div><div onclick="choose(6)" title="6. Светлый матовый"></div><div onclick="choose(7)" title="7. Контраст граней"></div><div onclick="choose(8)" title="8. Сбалансированный"></div></div></div></div><script>function choose(n){document.querySelector('#choice').textContent='Выбран вариант '+n+' — напиши этот номер в чат'}</script></html>
