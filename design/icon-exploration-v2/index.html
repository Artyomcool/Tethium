<script>const tiles=[...document.querySelectorAll('.tile')],modal=document.getElementById('modal');let current=0;function open(i){current=(i+256)%256;let t=tiles[current];for(let id of ['large','small','medium'])document.getElementById(id).src=t.querySelector('img').src;document.getElementById('caption').textContent=t.dataset.n.padStart(3,'0')+' · '+t.title;modal.classList.add('open')}tiles.forEach((t,i)=>t.onclick=()=>open(i));document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.getElementById('choose').onclick=()=>{tiles.forEach(t=>t.classList.remove('chosen'));tiles[current].classList.add('chosen');document.getElementById('counter').textContent='Выбран: '+String(current+1).padStart(3,'0');modal.classList.remove('open')};document.getElementById('theme').onclick=e=>{document.body.classList.toggle('light');e.target.textContent=document.body.classList.contains('light')?'Тёмный фон':'Светлый фон'};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open');if(modal.classList.contains('open')&&['ArrowLeft','ArrowRight'].includes(e.key))open(current+(e.key==='ArrowRight'?1:-1))});</script></html>
